<!doctype html>
<html>
<head><meta charset="utf-8"><title>Eule {{ date }}</title></head>
<body>
<h1>Eule — {{ date }}</h1>
<table>
    {% for row in rows %}
    <tr><td>{{ row.ticker }}</td><td>{{ row.price }}</td><td>{{ row.change }}</td><td>{{
        row.next_earnings }}</td> <td>{{ row.explanation }}
        <ul>
            {% for n in row.news %}
            <li><a href="{{ n.url }}">{{ n.headline }}</a> ({{ n.source }})</li>
            {% endfor %}
        </ul></td></tr>
    {% endfor %}
</table>
</body>
</html>
